name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: iOS Build
    runs-on: macos-latest

    defaults:
      run:
        working-directory: VlessBox

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify project file
        run: |
          python gen_xcode.py

      - name: Create workspace structure
        run: |
          mkdir -p VlessBox.xcworkspace/xcshareddata/xcworkspacedata/WorkspaceSettings/Settings.bundle

          cat > VlessBox.xcworkspace/xcshareddata/xcworkspacedata/contents.xcworkspacedeclaration << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Workspace version="1.0">
             <FileRef location="group:VlessBox.xcodeproj"/>
          </Workspace>
          EOF

          cat > VlessBox.xcworkspace/xcshareddata/xcworkspacedata/WorkspaceSettings/Settings.bundle/Root.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>StringsTable</key>
              <string>Root</string>
              <key>PreferenceSpecifiers</key>
              <array/>
          </dict>
          </plist>
          EOF

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Clean build
        run: |
          xcodebuild clean \
            -scheme VlessBox \
            -configuration Release \
            -project VlessBox.xcodeproj

      - name: Build IPA
        run: |
          xcodebuild archive \
            -scheme VlessBox \
            -configuration Release \
            -project VlessBox.xcodeproj \
            -xcconfig Release.xcconfig \
            -archivePath build/VlessBox.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/VlessBox.xcarchive \
            -exportPath build/ \
            -exportOptionsPlist exportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VlessBox
          path: VlessBox/build/VlessBox.ipa
          retention-days: 7