name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: iOS Build
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Verify project file
        run: |
          cd VlessBox
          python gen_xcode.py
      
      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version
      
      - name: Clean build
        run: |
          cd VlessBox
          xcodebuild clean \
            -scheme VlessBox \
            -configuration Release \
            -project VlessBox.xcodeproj
      
      - name: Build IPA
        run: |
          cd VlessBox
          xcodebuild archive \
            -scheme VlessBox \
            -configuration Release \
            -project VlessBox.xcodeproj \
            -xcconfig Release.xcconfig \
            -archivePath build/VlessBox.xcarchive \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/VlessBox.xcarchive \
            -exportPath build/ \
            -exportOptionsPlist exportOptions.plist
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VlessBox
          path: VlessBox/build/VlessBox.ipa
          retention-days: 7
