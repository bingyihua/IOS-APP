trigger:
  branches:
    only:
      - main
  tags:
    only:
      - v*
  manual:
    branches:
      - "**"

environment:
  xcode: "15.4"
  vars:
    APP_NAME: "VlessBox"

workflows:
  ios-workflow:
    name: VlessBox iOS Build
    max_build_duration: 60

    scripts:
      - name: Setup environment
        script: |
          xcodebuild -version
          swift --version
          pwd
          ls -la

      - name: Refresh Xcode project
        script: |
          echo "Regenerating project.pbxproj to fix template placeholders..."
          python gen_xcode.py

      - name: Build IPA
        script: |
          pwd
          ls -la
          echo "=== Project file header (first 5 lines) ==="
          head -5 VlessBox.xcodeproj/project.pbxproj
          echo "=== Hex of first 20 bytes ==="
          xxd VlessBox.xcodeproj/project.pbxproj | head -1
          xcodebuild archive \
            -scheme VlessBox \
            -project VlessBox.xcodeproj \
            -xcconfig Release.xcconfig \
            -archivePath "$HOME/BuildArtifacts/VlessBox.xcarchive" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

    artifacts:
      - BuildArtifacts/VlessBox.xcarchive
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/XcodeBuild.log
