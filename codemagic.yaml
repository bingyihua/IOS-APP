trigger:
  branches:
    only:
      - main
  tags:
    only:
      - v*
  manual:
    branches:
      - "**"

environment:
  xcode: "15.4"
  vars:
    APP_NAME: "VlessBox"

workflows:
  ios-workflow:
    name: VlessBox iOS Build
    max_build_duration: 60

    scripts:
      - name: Setup environment
        script: |
          xcodebuild -version
          swift --version
          pwd
          ls -la

      - name: Create workspace structure
        script: |
          mkdir -p VlessBox.xcworkspace/xcshareddata/xcworkspacedata/WorkspaceSettings/Settings.bundle

          cat > VlessBox.xcworkspace/xcshareddata/xcworkspacedata/contents.xcworkspacedeclaration << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Workspace version="1.0">
             <FileRef location="group:VlessBox.xcodeproj"/>
          </Workspace>
          EOF

          cat > VlessBox.xcworkspace/xcshareddata/xcworkspacedata/WorkspaceSettings/Settings.bundle/Root.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>StringsTable</key>
              <string>Root</string>
              <key>PreferenceSpecifiers</key>
              <array/>
          </dict>
          </plist>
          EOF

      - name: Build IPA
        script: |
          pwd
          ls -la
          xcodebuild archive \
            -scheme VlessBox \
            -project VlessBox.xcodeproj \
            -xcconfig VlessBox/Release.xcconfig \
            -derivedDataPath DerivedData \
            -archivePath "$HOME/BuildArtifacts/VlessBox.xcarchive" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

    artifacts:
      - BuildArtifacts/VlessBox.xcarchive
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/XcodeBuild.log