# ============================================
# VlessBox - Codemagic CI/CD Configuration
# ============================================

trigger:
  branches:
    only:
      - main
  tags:
    only:
      - v*
  manual:
    branches:
      - "**"

cache:
  cache_paths:
    - C:\Users\Administrator/Library/Caches/CocoaPods

environment:
  xcode: "15.4"
  vars:
    APP_NAME: "VlessBox"
    BUNDLE_ID: "com.vlessbox.app"
    XCODE_WORKSPACE: "VlessBox.xcodeproj"
    XCODE_SCHEME: "VlessBox"

workflows:
  ios-workflow:
    name: VlessBox iOS Build
    max_build_duration: 60
    instance_type: mac_mini

    triggering:
      events:
        - push
        - tag
        - pull_request

    scripts:
      - name: Setup environment
        script: |
          xcodebuild -version
          xcode-select -p
          swift --version
          ls /Applications | grep Xcode

      - name: Build IPA
        script: |
          cd VlessBox
          xcodebuild archive \
            -scheme  \
            -configuration Release \
            -project  \
            -archivePath "C:\Users\Administrator/BuildArtifacts/.xcarchive" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

    artifacts:
      - BuildArtifacts/.xcarchive
      - C:\Users\Administrator/Library/Developer/Xcode/DerivedData/**/Logs/XcodeBuild.log
      - /tmp/xcodebuild_logs/*.log
