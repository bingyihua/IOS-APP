trigger:
  branches:
    only:
      - main
  tags:
    only:
      - v*
  manual:
    branches:
      - "**"

environment:
  xcode: "15.4"
  vars:
    APP_NAME: "VlessBox"
    XCODE_WORKSPACE: "VlessBox.xcodeproj"
    XCODE_SCHEME: "VlessBox"

workflows:
  ios-workflow:
    name: VlessBox iOS Build
    max_build_duration: 60

    scripts:
      - name: Setup environment
        script: |
          xcodebuild -version
          swift --version
          ls /Applications | grep Xcode

      - name: Build IPA
        script: |
          cd VlessBox
          xcodebuild archive \
            -scheme  \
            -project  \
            -configuration Release \
            -xcconfig Release.xcconfig \
            -archivePath "C:\Users\Administrator/BuildArtifacts/.xcarchive" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

    artifacts:
      - BuildArtifacts/.xcarchive
      - C:\Users\Administrator/Library/Developer/Xcode/DerivedData/**/Logs/XcodeBuild.log
